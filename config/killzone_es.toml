# Frame timer runs on every vblank instead of every other one (docs/findings.md#frame-timing-key-for-high-refresh).
# With the port's virtual vblank rate R (= target fps) and seconds-per-vsync (0x55A6E4) = 1/R, the simulation steps by
# real elapsed time at R frames per second.
[patches]
instructions = [
  { address = "0x001C0120", value = "0x00000000" }, # FUN_001bfe88: add.s $f0,$f0,$f0 -> nop  (tick = 1 vsync period)
  { address = "0x001C0134", value = "0x00052802" }, # FUN_001bfe88: srl $a1,$a1,1 -> srl $a1,$a1,0
  { address = "0x001C0138", value = "0x00031802" }, # FUN_001bfe88: srl $v1,$v1,1 -> srl $v1,$v1,0
  { address = "0x001C01BC", value = "0x00021002" }, # FUN_001bff10: srl $v0,$v0,1 -> srl $v0,$v0,0
  # SCES-52004 is a PAL build: run the game's NTSC 60 Hz / 448-line path and its _NTSC movies (same sites as the PAL set,
  # video setup FUN_001bd5d8 +0xDC and the "Video mode" property setter FUN_001c2270 +0x14).
  { address = "0x001BD6B4", value = "0x38420001" }, # xori $v0,$v0,2 -> xori $v0,$v0,1
  { address = "0x001C2284", value = "0xAC400030" }, # sw $v1,0x30($v0) -> sw $zero,0x30($v0)
]
